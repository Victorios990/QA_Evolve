# Aplicação alvo — Parabank rodando localmente via Docker (docker compose up -d)
# Para usar o site público (quando disponível): https://parabank.parasoft.com
base.url=http://localhost:8080

# Navegador: chrome | firefox
browser=chrome
headless=false

# Banco de Dados (PostgreSQL local via Docker)
# Para DB2 real, trocar por: jdbc:db2://host:50000/BANKING
db.url=jdbc:postgresql://localhost:5432/banking_db
db.user=qa_user
db.password=qa_password

# ─────────────────────────────────────────────────
# Mobile / Appium
# App de treino: Sauce Labs My Demo App
# APK: https://github.com/saucelabs/my-demo-app-rn/releases
# Coloque o APK em: src/test/resources/apps/my_demo_app.apk
# ─────────────────────────────────────────────────
appium.server.url=http://localhost:4723

# Plataforma: android | ios
mobile.platform=android

# Nome do emulador/device (ver: adb devices)
mobile.device.name=Pixel_5_API_31

# Versão do Android (ex: 12.0)
mobile.platform.version=12.0

# Caminho para o APK do app de treino
mobile.app.path=src/test/resources/apps/my_demo_app.apk

# Package e Activity (Android)
mobile.app.package=com.saucelabs.mydemoapp.rn
mobile.app.activity=com.saucelabs.mydemoapp.rn.MainActivity

# Bundle ID (iOS — preencher se usar iOS)
mobile.bundle.id=com.saucelabs.mydemoapp.rn
