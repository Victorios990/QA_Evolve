<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>iGaming QA Demo — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d1117; color: #e6edf3; min-height: 100vh; display:flex; align-items:center; }
    .card { background: #161b22; border: 1px solid #30363d; }
    .form-control { background:#0d1117; border-color:#30363d; color:#e6edf3; }
    .form-control:focus { background:#0d1117; color:#e6edf3; border-color:#58a6ff; box-shadow:none; }
    .logo { font-size:2rem; font-weight:700; color:#58a6ff; }
  </style>
</head>
<body>
  <div class="container" style="max-width:400px">
    <div class="text-center mb-4">
      <div class="logo">⚡ iGaming</div>
      <div class="text-muted small">QA Demo Environment</div>
    </div>
    <div class="card p-4">
      <div class="alert alert-danger d-none" role="alert" id="error-msg"></div>
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input type="text" id="username" class="form-control" placeholder="player01">
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="Senha@123">
      </div>
      <button id="btn-login" class="btn btn-primary w-100 fw-bold">Entrar</button>
      <div class="text-muted small mt-3 text-center">
        player01 / Senha@123 &nbsp;|&nbsp; admin_qa / Admin@Seguro1
      </div>
    </div>
  </div>

  <script>
    const errorEl = document.getElementById('error-msg');

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorEl.classList.add('d-none');
      document.getElementById('btn-login').disabled = true;

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user_role',    data.role);
          localStorage.setItem('username',     username);
          window.location.href = '/account/wallet';
        } else {
          errorEl.textContent = data.error || 'Credenciais inválidas';
          errorEl.classList.remove('d-none');
          document.getElementById('btn-login').disabled = false;
        }
      } catch {
        errorEl.textContent = 'Erro ao conectar ao servidor';
        errorEl.classList.remove('d-none');
        document.getElementById('btn-login').disabled = false;
      }
    }

    document.getElementById('btn-login').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
