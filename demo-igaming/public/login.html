<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>iGaming QA Demo — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --bg-primary:   #0d1117;
      --bg-secondary: #161b22;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-muted:   #8b949e;
      --accent:       #58a6ff;
    }
    body.light {
      --bg-primary:   #ffffff;
      --bg-secondary: #f6f8fa;
      --border-color: #d0d7de;
      --text-primary: #1f2328;
      --text-muted:   #656d76;
      --accent:       #0969da;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      transition: background .2s, color .2s;
    }
    .card { background: var(--bg-secondary); border: 1px solid var(--border-color); }
    .form-control {
      background: var(--bg-primary);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .form-control:focus {
      background: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--accent);
      box-shadow: none;
    }
    .form-label { color: var(--text-primary); }
    .logo { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .hint-text { color: var(--text-primary); opacity: .75; }

    #theme-toggle {
      position: fixed;
      top: .8rem;
      left: .8rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: .25rem .55rem;
      font-size: 1rem;
      cursor: pointer;
      z-index: 9999;
      transition: background .2s;
    }
    #theme-toggle:hover { border-color: var(--accent); }
  </style>
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'light')
        document.documentElement.style.setProperty('--pre-light', '1');
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" title="Alternar tema">☀️</button>

  <div class="container" style="max-width:400px">
    <div class="text-center mb-4">
      <div class="logo">⚡ iGaming</div>
      <div class="small" style="color:var(--text-muted)">QA Demo Environment</div>
    </div>
    <div class="card p-4">
      <div class="alert alert-danger d-none" role="alert" id="error-msg"></div>
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input type="text" id="username" class="form-control" placeholder="player01">
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="Senha@123">
      </div>
      <button id="btn-login" class="btn btn-primary w-100 fw-bold">Entrar</button>
      <div class="hint-text small mt-3 text-center">
        player01 / Senha@123 &nbsp;|&nbsp; admin_qa / Admin@Seguro1
      </div>
    </div>
  </div>

  <script>
    // ── Tema ──────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      document.body.classList.toggle('light', theme === 'light');
      document.getElementById('theme-toggle').textContent = theme === 'light' ? '🌙' : '☀️';
    }
    function toggleTheme() {
      const next = (localStorage.getItem('theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    applyTheme(localStorage.getItem('theme') || 'dark');

    // ── Login ─────────────────────────────────────────────────────────────────
    const errorEl = document.getElementById('error-msg');

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorEl.classList.add('d-none');
      document.getElementById('btn-login').disabled = true;

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user_role',    data.role);
          localStorage.setItem('username',     username);
          window.location.href = '/account/wallet';
        } else {
          errorEl.textContent = data.error || 'Credenciais inválidas';
          errorEl.classList.remove('d-none');
          document.getElementById('btn-login').disabled = false;
        }
      } catch {
        errorEl.textContent = 'Erro ao conectar ao servidor';
        errorEl.classList.remove('d-none');
        document.getElementById('btn-login').disabled = false;
      }
    }

    document.getElementById('btn-login').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
