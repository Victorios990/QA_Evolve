<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>iGaming QA Demo — Transações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --bg-primary:   #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary:  #21262d;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-muted:   #8b949e;
      --accent:       #58a6ff;
    }
    body.light {
      --bg-primary:   #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary:  #eaeef2;
      --border-color: #d0d7de;
      --text-primary: #1f2328;
      --text-muted:   #656d76;
      --accent:       #0969da;
    }
    body { background: var(--bg-primary); color: var(--text-primary); transition: background .2s, color .2s; }
    .navbar { background: var(--bg-secondary) !important; border-bottom: 1px solid var(--border-color); }
    .card   { background: var(--bg-secondary); border: 1px solid var(--border-color); }
    .form-control, .form-select {
      background: var(--bg-primary);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--accent);
      box-shadow: none;
    }
    .form-label { color: var(--text-primary); }
    .nav-link { color: var(--text-muted) !important; }
    .nav-link:hover, .nav-link.active { color: var(--accent) !important; }
    .text-muted { color: var(--text-muted) !important; }
    table { color: var(--text-primary); }
    thead th { background: var(--bg-tertiary); color: var(--text-muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
    tbody tr:hover { background: var(--bg-secondary); }
    .badge-deposito { background: #1f4423; color: #3fb950; }
    .badge-saque    { background: #4a1e1e; color: #f85149; }
    .badge-aposta   { background: #1e2d4a; color: #58a6ff; }
    .no-results-message { text-align: center; padding: 2rem; color: var(--text-muted); }
    .filter-panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; }
    #pagination-next, #pagination-prev {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: .3rem .8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #pagination-next:hover, #pagination-prev:hover { border-color: var(--accent); color: var(--accent); }

    #theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: .2rem .5rem;
      font-size: .95rem;
      cursor: pointer;
      color: var(--text-primary);
    }
    #theme-toggle:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid px-4">
      <button id="theme-toggle" title="Alternar tema">☀️</button>
      <span class="navbar-brand fw-bold text-info ms-2">⚡ iGaming QA</span>
      <div class="d-flex gap-3 align-items-center">
        <a href="/account/wallet"       class="nav-link">Carteira</a>
        <a href="/sportsbook"           class="nav-link">Sportsbook</a>
        <a href="/account/transactions" class="nav-link active">Transações</a>
        <a href="/admin/tenants"        class="nav-link" id="nav-admin" style="display:none">Admin</a>
        <button onclick="logout()" class="btn btn-sm btn-outline-secondary">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="alert alert-success d-none" id="msg-success"></div>
    <div class="alert alert-danger  d-none" id="msg-error"></div>

    <!-- Filtros -->
    <div class="filter-panel mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-2">
          <label class="form-label small" style="color:var(--text-muted)">Tipo</label>
          <select id="filter-type" class="form-select form-select-sm">
            <option value="">Todos</option>
            <option value="Depósito">Depósito</option>
            <option value="Saque">Saque</option>
            <option value="Aposta">Aposta</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small" style="color:var(--text-muted)">Data início</label>
          <input type="text" id="filter-date-from" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
        </div>
        <div class="col-md-2">
          <label class="form-label small" style="color:var(--text-muted)">Data fim</label>
          <input type="text" id="filter-date-to" class="form-control form-control-sm" placeholder="DD/MM/AAAA">
        </div>
        <div class="col-md-2">
          <label class="form-label small" style="color:var(--text-muted)">Valor mín (R$)</label>
          <input type="number" id="filter-amount-min" class="form-control form-control-sm" placeholder="0.00">
        </div>
        <div class="col-md-2">
          <label class="form-label small" style="color:var(--text-muted)">Valor máx (R$)</label>
          <input type="number" id="filter-amount-max" class="form-control form-control-sm" placeholder="9999.00">
        </div>
        <div class="col-md-2 d-flex gap-2">
          <button id="btn-apply-filter" class="btn btn-sm btn-primary">Filtrar</button>
          <button id="btn-clear-filter" class="btn btn-sm btn-outline-secondary">Limpar</button>
        </div>
      </div>
    </div>

    <!-- Exportar -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="small" style="color:var(--text-muted)" id="total-label"></span>
      <button id="btn-export-csv" class="btn btn-sm btn-outline-secondary">⬇ Exportar CSV</button>
    </div>

    <!-- Tabela -->
    <div class="card">
      <table class="table table-borderless mb-0" id="transaction-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="transaction-tbody"></tbody>
      </table>
      <div class="no-results-message d-none" id="no-results-msg">Nenhuma transação encontrada</div>
    </div>

    <!-- Paginação -->
    <div class="d-flex justify-content-center gap-2 mt-3" id="pagination-bar">
      <button id="pagination-prev" onclick="changePage(-1)" style="display:none">← Anterior</button>
      <span class="small align-self-center" style="color:var(--text-muted)" id="page-label"></span>
      <button id="pagination-next" onclick="changePage(1)">Próxima →</button>
    </div>
  </div>

  <script>
    // ── Tema ──────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      document.body.classList.toggle('light', theme === 'light');
      document.getElementById('theme-toggle').textContent = theme === 'light' ? '🌙' : '☀️';
    }
    function toggleTheme() {
      const next = (localStorage.getItem('theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    applyTheme(localStorage.getItem('theme') || 'dark');

    // ── App ───────────────────────────────────────────────────────────────────
    const token    = localStorage.getItem('access_token');
    const role     = localStorage.getItem('user_role');
    const tenantId = 'operadora-a';

    if (!token) window.location.href = '/login';
    if (role === 'admin') document.getElementById('nav-admin').style.display = 'inline';

    function logout() { localStorage.clear(); window.location.href = '/login'; }

    function authHeaders() {
      return { Authorization: `Bearer ${token}`, 'X-Tenant-Id': tenantId };
    }

    let currentPage = 1;
    const PAGE_SIZE = 10;

    function buildQueryParams(page) {
      const params = new URLSearchParams({ page, limit: PAGE_SIZE });
      const type      = document.getElementById('filter-type').value;
      const dateFrom  = document.getElementById('filter-date-from').value.trim();
      const dateTo    = document.getElementById('filter-date-to').value.trim();
      const amountMin = document.getElementById('filter-amount-min').value;
      const amountMax = document.getElementById('filter-amount-max').value;

      if (type)      params.set('type',       type);
      if (dateFrom)  params.set('date_from',  dateFrom);
      if (dateTo)    params.set('date_to',    dateTo);
      if (amountMin) params.set('amount_min', amountMin);
      if (amountMax) params.set('amount_max', amountMax);

      return params.toString();
    }

    function badgeClass(type) {
      if (type === 'Depósito') return 'badge-deposito';
      if (type === 'Saque')    return 'badge-saque';
      return 'badge-aposta';
    }

    async function loadTransactions(page = 1) {
      const errEl = document.getElementById('msg-error');
      errEl.classList.add('d-none');

      const dateFrom = document.getElementById('filter-date-from').value.trim();
      const dateTo   = document.getElementById('filter-date-to').value.trim();

      if (dateFrom && dateTo) {
        const parse = s => { const [d,m,y] = s.split('/'); return new Date(`${y}-${m}-${d}`); };
        if (parse(dateFrom) > parse(dateTo)) {
          errEl.textContent = 'Período de datas inválido';
          errEl.classList.remove('d-none');
          return;
        }
      }

      const qs  = buildQueryParams(page);
      const res = await fetch(`/api/transactions?${qs}`, { headers: authHeaders() });
      const data = await res.json();

      const { transactions, total } = data;
      const tbody      = document.getElementById('transaction-tbody');
      const noResults  = document.getElementById('no-results-msg');
      const totalLabel = document.getElementById('total-label');

      if (!transactions.length) {
        tbody.innerHTML = '';
        noResults.classList.remove('d-none');
        totalLabel.textContent = '0 transações';
        document.getElementById('pagination-bar').style.display = 'none';
        return;
      }

      noResults.classList.add('d-none');
      totalLabel.textContent = `${total} transação(ões)`;

      tbody.innerHTML = transactions.map(tx => `
        <tr data-id="${tx.id}">
          <td>${new Date(tx.date).toLocaleDateString('pt-BR')}</td>
          <td class="type"><span class="badge ${badgeClass(tx.type)} px-2 py-1 rounded">${tx.type}</span></td>
          <td class="amount">R$ ${tx.amount.toFixed(2)}</td>
          <td>${tx.status}</td>
        </tr>`).join('');

      const totalPages = Math.ceil(total / PAGE_SIZE);
      document.getElementById('pagination-bar').style.display = total > PAGE_SIZE ? 'flex' : 'none';
      document.getElementById('page-label').textContent   = `Página ${page} de ${totalPages}`;
      document.getElementById('pagination-prev').style.display = page > 1           ? 'inline' : 'none';
      document.getElementById('pagination-next').style.display = page < totalPages  ? 'inline' : 'none';

      currentPage = page;
    }

    function changePage(delta) {
      loadTransactions(currentPage + delta);
    }

    document.getElementById('btn-apply-filter').addEventListener('click', () => loadTransactions(1));

    document.getElementById('btn-clear-filter').addEventListener('click', () => {
      document.getElementById('filter-type').value       = '';
      document.getElementById('filter-date-from').value  = '';
      document.getElementById('filter-date-to').value    = '';
      document.getElementById('filter-amount-min').value = '';
      document.getElementById('filter-amount-max').value = '';
      document.getElementById('msg-error').classList.add('d-none');
      loadTransactions(1);
    });

    document.getElementById('btn-export-csv').addEventListener('click', async () => {
      const res = await fetch('/api/transactions/export', { headers: authHeaders() });
      if (res.ok) {
        document.getElementById('msg-success').textContent = 'Exportação concluída com sucesso';
        document.getElementById('msg-success').classList.remove('d-none');
        setTimeout(() => document.getElementById('msg-success').classList.add('d-none'), 3000);
      }
    });

    loadTransactions(1);
  </script>
</body>
</html>
