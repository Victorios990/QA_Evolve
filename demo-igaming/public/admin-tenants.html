<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>iGaming QA Demo — Admin Tenants</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background:#0d1117; color:#e6edf3; }
    .navbar { background:#161b22 !important; border-bottom:1px solid #30363d; }
    .card  { background:#161b22; border:1px solid #30363d; }
    .form-control, .form-select { background:#0d1117; border-color:#30363d; color:#e6edf3; }
    .form-control:focus, .form-select:focus { background:#0d1117; color:#e6edf3; border-color:#58a6ff; box-shadow:none; }
    .nav-link { color:#8b949e !important; }
    .nav-link:hover, .nav-link.active { color:#58a6ff !important; }
    .stat-box { background:#21262d; border-radius:8px; padding:1.2rem; text-align:center; }
    .stat-value { font-size:1.8rem; font-weight:700; color:#58a6ff; }
    .access-denied-message { text-align:center; padding:3rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold text-info">⚡ iGaming QA</span>
      <div class="d-flex gap-3 align-items-center">
        <a href="/account/wallet"       class="nav-link">Carteira</a>
        <a href="/sportsbook"           class="nav-link">Sportsbook</a>
        <a href="/account/transactions" class="nav-link">Transações</a>
        <a href="/admin/tenants"        class="nav-link active">Admin</a>
        <button onclick="logout()" class="btn btn-sm btn-outline-secondary">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width:700px">

    <!-- Acesso negado (player) -->
    <div class="access-denied-message" id="access-denied-section" style="display:none">
      <div style="font-size:3rem">🚫</div>
      <h4 class="mt-2 text-danger">Acesso negado</h4>
      <p class="text-muted">Você não tem permissão para acessar este painel.</p>
    </div>

    <!-- Painel admin -->
    <div id="admin-panel" style="display:none">
      <h5 class="mb-3">Gerenciamento de Tenants</h5>

      <div class="alert alert-success d-none" id="msg-success"></div>
      <div class="alert alert-danger  d-none" id="msg-error"></div>

      <!-- Tenant atual -->
      <div class="card p-3 mb-4">
        <div class="text-muted small mb-1">Tenant atual</div>
        <div class="fw-bold fs-5" id="current-tenant-name">—</div>
      </div>

      <!-- Estatísticas do tenant -->
      <div class="row g-3 mb-4">
        <div class="col-6">
          <div class="stat-box">
            <div class="text-muted small">Usuários</div>
            <div class="stat-value" id="tenant-user-count">—</div>
          </div>
        </div>
        <div class="col-6">
          <div class="stat-box">
            <div class="text-muted small">Saldo total (R$)</div>
            <div class="stat-value" id="tenant-balance-total">—</div>
          </div>
        </div>
      </div>

      <!-- Trocar tenant -->
      <div class="card p-4">
        <h6 class="mb-3">Trocar tenant</h6>
        <div class="mb-3">
          <select id="tenant-selector" class="form-select">
            <option value="operadora-a">Operadora A</option>
            <option value="operadora-b">Operadora B</option>
            <option value="Tenant-Inexistente">Tenant Inválido (Teste QA)</option>
          </select>
        </div>
        <button id="btn-switch-tenant" class="btn btn-primary w-100">Trocar Tenant</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('access_token');
    const role  = localStorage.getItem('user_role');

    if (!token) window.location.href = '/login';

    function logout() { localStorage.clear(); window.location.href = '/login'; }

    function authHeaders() {
      return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
    }

    function showAlert(type, msg) {
      const s = document.getElementById('msg-success');
      const e = document.getElementById('msg-error');
      s.classList.add('d-none'); e.classList.add('d-none');
      if (type === 'success') { s.textContent = msg; s.classList.remove('d-none'); }
      else                    { e.textContent = msg; e.classList.remove('d-none'); }
    }

    // ── Renderização por role ────────────────────────────────────────────────

    if (role !== 'admin') {
      // Player: mostra acesso negado, painel admin não existe no DOM
      document.getElementById('access-denied-section').style.display = 'block';
      // Remove completamente o painel para que não exista no DOM
      document.getElementById('admin-panel').remove();
    } else {
      document.getElementById('admin-panel').style.display = 'block';
      loadTenants();
    }

    let currentTenantId = 'operadora-a';

    async function loadTenants() {
      const res  = await fetch('/api/admin/tenants', { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok) { showAlert('error', data.error); return; }

      const first = data.tenants[0];
      updateTenantDisplay(first.id, first);
    }

    function updateTenantDisplay(tenantId, tenant) {
      currentTenantId = tenantId;
      document.getElementById('current-tenant-name').textContent = tenantId;
      document.getElementById('tenant-user-count').textContent   = tenant.userCount  || '—';
      document.getElementById('tenant-balance-total').textContent = tenant.totalBalance
        ? `R$ ${parseFloat(tenant.totalBalance).toFixed(2)}`
        : '—';
    }

    document.getElementById('btn-switch-tenant')?.addEventListener('click', async function() {
      const tenantId = document.getElementById('tenant-selector').value;

      const res  = await fetch('/api/admin/tenants/switch', {
        method:  'POST',
        headers: authHeaders(),
        body:    JSON.stringify({ tenant_id: tenantId }),
      });
      const data = await res.json();

      if (res.ok) {
        updateTenantDisplay(tenantId, data.tenant);
        showAlert('success', 'Tenant alternado com sucesso');
      } else {
        showAlert('error', data.error || 'Você não tem permissão para acessar este tenant');
      }
    });
  </script>
</body>
</html>
